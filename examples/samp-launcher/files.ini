; examples/samp-launcher/files.ini — готовый шаблон для SA-MP сервера.
; Замените cdn.example.personal на ваш домен Tatnet/Layer0/Onreza,
; а URL внутри ?url=... — на ссылки, полученные расширением Personal CDN Zero.

[models]
; название = CDN-URL|remote
models/vehicle-mods.dff = https://cdn.example.personal/cdn/samp-packs/file.bin?url=https%3A%2F%2Fdl.dropboxusercontent.com%2Fs%2Faaaa1111%2Fvehicle-mods.dff%3Fdl%3D1|remote
models/player-skins.txd = https://cdn.example.personal/cdn/samp-packs/file.bin?url=https%3A%2F%2Fdrive.usercontent.google.com%2Fdownload%3Fid%3D1AbCdEfGhIjKlMnOpQrStUvWxYz%26export%3Ddownload|remote

[sounds]
sounds/interface.wav = https://cdn.example.personal/cdn/samp-packs/file.bin?url=https%3A%2F%2Fonedrive.live.com%2Fdownload%3Fresid%3DABCDEF%2521123%26authkey%3Dsecretkey|remote

[other]
; Полный архив клиентской части мода (зеркало на Яндекс.Дiske обновляйте чаще — подписи протухают)
client-pack.zip = https://cdn.example.personal/cdn/samp-packs/file.bin?url=https%3A%2F%2Fdisk.yandex.ru%2Fi%2Fk7LmN9pQrS%3Fw%3D1|remote

; ─────────────────────────────────────────────────────────────
; HYBRID CONFIG (пример): наш CDN — основной источник, внешний
; сторонний CDN — только ЗЕРКАЛО на стороне лаунчера. Личный
; прокси Personal CDN Zero сторонние CDN НЕ проксирует.
; ─────────────────────────────────────────────────────────────
[hybrid-mirrors]
; основной канал: наш /cdn/{folder}/{filename} (кэш immutable + Accept-Ranges: bytes)
textures/ui-pack.asi = https://cdn.example.personal/cdn/samp-textures/ui-pack.asi?url=https%3A%2F%2Fdl.dropboxusercontent.com%2Fs%2Fzz2222%2Fui-pack.asi%3Fdl%3D1|remote
; резервный канал: прямой URL внешнего CDN без нашего прокси (настраивает админ сервера)
